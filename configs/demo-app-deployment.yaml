apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # picked up by the default scrape config of the prometheus-community chart
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-app
          image: demo-app:local  # built and loaded into kind by scripts/setup.sh
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: WORK_MS
              value: "20"
          resources:
            # HPA utilization is measured against this request, so it matters for the baseline
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080