# Baseline for the comparison. Remove it before applying the PredictiveScaler
# (load-tests/run.sh does this): two controllers on one Deployment would fight.
# No custom behavior block on purpose, so this is the stock HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 80% of the 100m request is 80m of CPU per pod. At ~22 ms of CPU per
          # request that is about 3.6 requests/s, which is what requestsPerReplica
          # in the PredictiveScaler is set to, so both aim at the same load per pod.
          averageUtilization: 80